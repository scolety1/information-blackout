name: Checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - run: npm run eval
      - run: npm run eval:m4
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/e2e/extension.spec.ts tests/e2e/mission2.spec.ts
